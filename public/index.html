<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NordMatch</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b class="logo">Nord<span>Match</span></b><div><button class="bell hidden" id="bell" onclick="notifications()"><span id="notifCount">0</span></button><b id="coins"></b></div></header><main>
<section id="gate" class="center"><div class="panel"><h1>Ülkeni seç</h1><select id="country"><option value="AL">🇦🇱 Albania</option><option value="AD">🇦🇩 Andorra</option><option value="AM">🇦🇲 Armenia</option><option value="AT">🇦🇹 Austria</option><option value="AZ">🇦🇿 Azerbaijan</option><option value="BY">🇧🇾 Belarus</option><option value="BE">🇧🇪 Belgium</option><option value="BA">🇧🇦 Bosnia and Herzegovina</option><option value="BG">🇧🇬 Bulgaria</option><option value="HR">🇭🇷 Croatia</option><option value="CY">🇨🇾 Cyprus</option><option value="CZ">🇨🇿 Czechia</option><option value="DK">🇩🇰 Denmark</option><option value="EE">🇪🇪 Estonia</option><option value="FI">🇫🇮 Finland</option><option value="FR">🇫🇷 France</option><option value="GE">🇬🇪 Georgia</option><option value="DE">🇩🇪 Germany</option><option value="GR">🇬🇷 Greece</option><option value="HU">🇭🇺 Hungary</option><option value="IS">🇮🇸 Iceland</option><option value="IE">🇮🇪 Ireland</option><option value="IT">🇮🇹 Italy</option><option value="XK">🇽🇰 Kosovo</option><option value="LV">🇱🇻 Latvia</option><option value="LI">🇱🇮 Liechtenstein</option><option value="LT">🇱🇹 Lithuania</option><option value="LU">🇱🇺 Luxembourg</option><option value="MT">🇲🇹 Malta</option><option value="MD">🇲🇩 Moldova</option><option value="MC">🇲🇨 Monaco</option><option value="ME">🇲🇪 Montenegro</option><option value="NL">🇳🇱 Netherlands</option><option value="MK">🇲🇰 North Macedonia</option><option value="NO">🇳🇴 Norway</option><option value="PL">🇵🇱 Poland</option><option value="PT">🇵🇹 Portugal</option><option value="RO">🇷🇴 Romania</option><option value="SM">🇸🇲 San Marino</option><option value="RS">🇷🇸 Serbia</option><option value="SK">🇸🇰 Slovakia</option><option value="SI">🇸🇮 Slovenia</option><option value="ES">🇪🇸 Spain</option><option value="SE">🇸🇪 Sweden</option><option value="CH">🇨🇭 Switzerland</option><option value="TR">🇹🇷 Türkiye</option><option value="UA">🇺🇦 Ukraine</option><option value="GB">🇬🇧 United Kingdom</option><option value="VA">🇻🇦 Vatican City</option></select><h2>Dilini seç</h2><select id="language"><option value="sq">Shqip</option><option value="hy">Հայերեն</option><option value="de">Deutsch</option><option value="az">Azərbaycan dili</option><option value="be">Беларуская</option><option value="nl">Nederlands</option><option value="bs">Bosanski</option><option value="bg">Български</option><option value="hr">Hrvatski</option><option value="el">Ελληνικά</option><option value="cs">Čeština</option><option value="da">Dansk</option><option value="et">Eesti</option><option value="fi">Suomi</option><option value="fr">Français</option><option value="ka">ქართული</option><option value="hu">Magyar</option><option value="is">Íslenska</option><option value="en">English</option><option value="it">Italiano</option><option value="lv">Latviešu</option><option value="lt">Lietuvių</option><option value="lb">Lëtzebuergesch</option><option value="mt">Malti</option><option value="ro">Română</option><option value="sr">Srpski</option><option value="mk">Македонски</option><option value="no">Norsk</option><option value="pl">Polski</option><option value="pt">Português</option><option value="sk">Slovenčina</option><option value="sl">Slovenščina</option><option value="es">Español</option><option value="sv">Svenska</option><option value="tr">Türkçe</option><option value="uk">Українська</option></select><button onclick="continueGate()">Devam</button></div></section>
<section id="auth" class="auth hidden"><div><h1>Gerçek bağlantılar. Daha sade bir deneyim.</h1><p>Avrupa genelinde modern tanışma platformu</p></div><div class="panel">
<input id="name" placeholder="Ad"><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre (min. 8 karakter)"><input id="age" type="number" min="18" placeholder="Yaş"><input id="city" placeholder="Şehir">
<select id="gender"><option value="man">Erkek</option><option value="woman">Kadın</option><option value="other">Diğer</option></select>
<select id="seeking"><option value="woman">Kadın arıyorum</option><option value="man">Erkek arıyorum</option><option value="everyone">Herkes</option></select>
<button onclick="register()">Hesap oluştur</button><button class="gray" onclick="login()">Giriş yap</button><button class="linkbtn" onclick="resetPassword()">Şifremi unuttum</button><p id="err"></p></div></section>
<section id="app" class="hidden"><nav><button onclick="profiles()">Keşfet</button><button onclick="matches()">Eşleşmeler</button><button onclick="inbox()">Mesajlar</button><button onclick="shop()">Jeton</button><button onclick="profile()">Profil</button><button id="adminBtn" class="hidden" onclick="adminPanel()">Admin</button><button class="gray" onclick="logout()">Çıkış</button></nav><div id="badge"></div><div id="content"></div></section></main>
<div id="modal" class="modal hidden"><div class="chat"><button class="x" onclick="closeChat()">×</button><h2 id="chatTitle"></h2><div class="chat-actions"><button class="danger-lite" onclick="reportUser()">Şikâyet</button><button class="danger" onclick="blockUser()">Engelle</button></div><div id="messages"></div><form id="send"><textarea id="msg" placeholder="Mesaj"></textarea><input id="photo" type="file" accept="image/*"><button>Gönder · 5 jeton</button></form></div></div>
<script src="/app.js"></script></body></html>
